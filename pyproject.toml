[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel"
version = "0.1.0"
description = "Small local coding agent for DeepSeek, OpenAI-compatible, Anthropic-compatible, and Ollama models"
requires-python = ">=3.10"
# Windows 没有系统时区库，zoneinfo 需要 tzdata 才能解析 "Asia/Shanghai" 这类名字。
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]

[project.scripts]
kestrel = "kestrel.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["kestrel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
